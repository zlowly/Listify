<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歌单排版生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">♫</span>
        <span>歌单排版</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-import" class="btn btn-primary">导入歌单</button>
        <span class="divider"></span>
        <button id="btn-add-text" class="btn">添加文字</button>
        <button id="btn-add-image" class="btn">添加图片</button>
        <span class="divider"></span>
        <button id="btn-save" class="btn">保存项目</button>
        <button id="btn-load" class="btn">加载项目</button>
        <button id="btn-export" class="btn btn-accent">导出 PNG</button>
      </div>
    </header>

    <div class="page-strip">
      <div id="page-tabs" class="page-tabs"></div>
      <div class="page-actions">
        <button id="btn-add-page" class="icon-btn" title="新增页面">＋</button>
        <button id="btn-delete-page" class="icon-btn" title="删除当前页">🗑</button>
      </div>
    </div>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-tabs" role="tablist">
          <button class="sidebar-tab active" data-panel="categories" role="tab">分类</button>
          <button class="sidebar-tab" data-panel="layers" role="tab">图层</button>
        </div>
        <div id="category-panel" class="sidebar-panel"></div>
        <div id="layer-panel" class="sidebar-panel" hidden></div>
        <div class="property-section">
          <div class="property-heading">
            <span>属性</span>
            <span id="selection-label" class="selection-label">页面</span>
          </div>
          <div id="property-panel" class="property-panel"></div>
        </div>
      </aside>

      <main id="canvas-pane" class="canvas-pane">
        <div id="leafer-view" class="leafer-view"></div>
        <canvas id="overlay" class="overlay"></canvas>
        <div id="empty-hint" class="empty-hint">
          <div class="empty-icon">♫</div>
          <div>导入歌单后，把左侧分类拖到页面上</div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast-root" class="toast-root"></div>

  <input id="import-file" type="file" accept=".txt,text/plain" hidden>
  <input id="load-file" type="file" accept=".json,application/json" hidden>
  <input id="bg-file" type="file" accept="image/*" hidden>
  <input id="free-image-file" type="file" accept="image/*" hidden>

  <script src="vendor/leafer-editor.min.js"></script>
  <script src="vendor/leafer-filter.min.js"></script>
  <script src="js/model.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/import.js"></script>
  <script src="js/render.js"></script>
  <script src="js/io.js"></script>
  <script src="js/export.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
