<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歌单排版生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="brand-mark">♫</span>
          <span>歌单排版</span>
        </div>
        <span id="draft-status" class="draft-status" data-state="idle" title="草稿会自动保存在本机浏览器中">自动保存已开启</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-new" class="btn">新建项目</button>
        <button id="btn-load" class="btn">导入项目</button>
        <button id="btn-save" class="btn">导出项目</button>
        <span class="divider"></span>
        <button id="btn-export" class="btn btn-primary">导出 PNG</button>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-tabs" role="tablist" aria-label="左侧面板">
          <button class="sidebar-tab active" data-panel="categories" role="tab"
            aria-selected="true" aria-controls="category-panel">分类</button>
          <button class="sidebar-tab" data-panel="layers" role="tab"
            aria-selected="false" aria-controls="layer-panel">图层</button>
        </div>
        <div id="category-toolbar" class="panel-toolbar">
          <button id="btn-import" class="btn btn-primary btn-sm">导入歌单</button>
          <button id="btn-export-playlist" class="btn btn-sm">导出歌单</button>
          <button id="btn-edit-playlist" class="btn btn-sm">编辑歌单</button>
          <button type="button" class="help-tip"
            data-tip="也可以直接把 .txt 文件拖入分类区域导入"
            aria-label="也可以直接把 .txt 文件拖入分类区域导入">?</button>
        </div>
        <div id="category-panel" class="sidebar-panel" role="tabpanel"></div>
        <div id="layer-panel" class="sidebar-panel" role="tabpanel" hidden></div>
      </aside>

      <main id="canvas-pane" class="canvas-pane">
        <div id="canvas-toolbar" class="canvas-toolbar" role="group" aria-label="页面与插入工具">
          <div class="canvas-toolbar-group canvas-toolbar-pages" role="group" aria-label="页面">
            <div id="page-tabs" class="page-tabs" role="tablist" aria-label="页面列表"></div>
            <button id="btn-add-page" class="icon-btn" aria-label="新增页面">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            </button>
            <button id="btn-delete-page" class="icon-btn" aria-label="删除当前页">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </div>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <div class="canvas-toolbar-group" role="group" aria-label="插入内容">
            <button id="btn-add-text" class="icon-btn" aria-label="添加文字">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
            </button>
            <button id="btn-add-image" class="icon-btn" aria-label="添加图片（也可 Ctrl+V 粘贴）">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </button>
          </div>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <div id="canvas-zoom-controls" class="canvas-toolbar-group canvas-zoom" role="group" aria-label="视图缩放">
            <button id="btn-zoom-out" class="icon-btn" aria-label="缩小（10% 为下限）">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            <input id="zoom-input" class="zoom-input" type="text" inputmode="numeric" value="100%"
              aria-label="缩放比例，10% 至 400%">
            <button id="btn-zoom-in" class="icon-btn" aria-label="放大（400% 为上限）">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            <button id="btn-zoom-fit" class="icon-btn" aria-label="适应窗口">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            </button>
          </div>
        </div>
        <div id="canvas-scroll" class="canvas-scroll">
          <div id="canvas-stage" class="canvas-stage">
            <div id="leafer-view" class="leafer-view"></div>
          </div>
        </div>
        <canvas id="overlay" class="overlay"></canvas>
        <div id="empty-hint" class="empty-hint">
          <div class="empty-icon">♫</div>
          <div>从左侧导入歌单，再把分类拖到页面上</div>
        </div>
      </main>

      <aside class="inspector" aria-label="属性检查栏">
        <div class="property-heading">
          <span>属性</span>
          <span id="selection-label" class="selection-label">页面</span>
        </div>
        <div id="property-panel" class="property-panel"></div>
      </aside>
    </div>
  </div>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast-root" class="toast-root"></div>

  <input id="import-file" type="file" accept=".txt,text/plain" hidden>
  <input id="load-file" type="file" accept=".json,application/json" hidden>
  <input id="bg-file" type="file" accept="image/*" hidden>
  <input id="free-image-file" type="file" accept="image/*" hidden>

  <script src="vendor/leafer-editor.min.js"></script>
  <script src="vendor/leafer-filter.min.js"></script>
  <script src="js/model.js?v=20261110c"></script>
  <script src="js/layout.js?v=20261110c"></script>
  <script src="js/import.js?v=20261110c"></script>
  <script src="js/playlist-export.js?v=20261110c"></script>
  <script src="js/render.js?v=20261110c"></script>
  <script src="js/io.js?v=20261110c"></script>
  <script src="js/zip.js?v=20261110c"></script>
  <script src="js/export.js?v=20261110c"></script>
  <script src="js/ui.js?v=20261110c"></script>
  <script src="js/fontpicker.js?v=20261110c"></script>
  <script src="js/clipboard-image.js?v=20261110c"></script>
  <script src="js/presets.js?v=20261110c"></script>
  <script src="js/app.js?v=20261110c"></script>
</body>
</html>
